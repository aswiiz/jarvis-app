<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>JARVIS</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="bar">
      <button id="btn-history" class="icon" aria-label="History">☰</button>
      <div class="title"><span class="spark">✦</span> JARVIS <span id="status-dot" class="dot" title="server"></span></div>
      <button id="btn-new" class="icon" aria-label="New chat">＋</button>
      <button id="btn-settings" class="icon" aria-label="Settings">⚙</button>
    </header>

    <div id="banner" class="banner hidden"></div>

    <main id="messages" class="messages"></main>

    <div id="chips" class="chips"></div>

    <footer class="inputbar">
      <button id="btn-camera" class="icon" aria-label="Camera">📷</button>
      <button id="btn-attach" class="icon" aria-label="Attach file">📎</button>
      <textarea id="input" rows="1" placeholder="Message JARVIS"></textarea>
      <button id="btn-send" class="send" aria-label="Send">➤</button>
      <input id="file" type="file" accept="image/*,audio/*" multiple hidden />
    </footer>
  </div>

  <!-- Settings -->
  <section id="settings" class="sheet hidden">
    <div class="sheet-inner">
      <h2>Settings</h2>
      <label>Backend URL (primary)
        <input id="set-url" type="url" placeholder="https://jarvis-backend.onrender.com" autocapitalize="off" autocomplete="off" />
      </label>
      <label>Backup URL (optional, used if primary is down)
        <input id="set-url2" type="url" placeholder="https://your-backup.vercel.app" autocapitalize="off" autocomplete="off" />
      </label>
      <label>App token
        <input id="set-token" type="password" autocomplete="off" />
      </label>
      <div id="test-result" class="test-result"></div>
      <div class="row">
        <button id="btn-test" class="btn">Test connection</button>
        <button id="btn-save" class="btn primary">Save</button>
        <button id="btn-close-settings" class="btn">Close</button>
      </div>
    </div>
  </section>

  <!-- History drawer -->
  <section id="history" class="sheet hidden">
    <div class="sheet-inner">
      <h2>History</h2>
      <div id="history-list" class="history-list"></div>
      <div class="row"><button id="btn-close-history" class="btn">Close</button></div>
    </div>
  </section>

  <div id="zoom" class="zoom hidden"><img alt="" /></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
